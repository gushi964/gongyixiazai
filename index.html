<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公益下载站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230f6fde'/%3E%3Cpath d='M7 11h10v2H7zM12 6.5l3.5 3.5h-2.2V13h-2.6V10H8.5z' fill='%23fff' transform='translate(0 1.5)'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#eef2f7;
    --surface:#ffffff;
    --ink:#182235;
    --muted:#66748a;
    --primary:#0f6fde;
    --primary-strong:#0a5bbf;
    --line:#e2e9f2;
    --input-bg:#f6f8fb;
    --input-focus:#ffffff;
    --card-shadow:0 6px 18px rgba(15,111,222,.08);
    --mark-a:#1683f2; --mark-b:#0f6fde;
  }
  html[data-theme="dark"]{
    --bg:#0e1520;
    --surface:#17212e;
    --ink:#e8eef5;
    --muted:#8fa0b5;
    --primary:#3d8bff;
    --primary-strong:#2f7ae8;
    --line:#263245;
    --input-bg:#1d2836;
    --input-focus:#1d2836;
    --card-shadow:0 6px 18px rgba(0,0,0,.35);
    --mark-a:#3d8bff; --mark-b:#2f7ae8;
  }
  html,body{transition:background-color .2s,color .2s}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Helvetica Neue",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
  }
  input,textarea{user-select:text;-webkit-user-select:text}
  img,svg{-webkit-user-drag:none;user-drag:none}
  a{color:inherit;text-decoration:none}
  /* ===== 顶部 ===== */
  .top{
    position:sticky;top:0;z-index:50;background:var(--surface);
    border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(20,40,80,.04);
  }
  .top-inner{
    max-width:1080px;margin:0 auto;padding:14px 18px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .brand .mark{
    width:42px;height:42px;border-radius:11px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--mark-a),var(--mark-b));display:grid;place-items:center;color:#fff;
  }
  .brand h1{font-size:20px;letter-spacing:.5px;line-height:1.2}
  .brand p{font-size:12px;color:var(--muted);margin-top:2px}
  .search{flex:1;min-width:220px;display:flex;gap:8px;margin-left:auto}
  .search-box{
    flex:1;position:relative;
  }
  .search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
  .search-box input{
    width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;background:var(--input-bg);color:var(--ink);outline:none;transition:border .15s,background .15s;
  }
  .search-box input:focus{border-color:var(--primary);background:var(--input-focus)}
  .count-btn{
    flex:0 0 auto;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
    font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:default;
  }
  /* ===== 主题切换按钮 ===== */
  .theme-btn{
    flex:0 0 auto;width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
    display:grid;place-items:center;cursor:pointer;color:var(--ink);position:relative;transition:border-color .15s,color .15s;
  }
  .theme-btn:hover{border-color:var(--primary);color:var(--primary)}
  .theme-btn svg{position:absolute;transition:opacity .2s,transform .2s}
  .theme-btn .ic-sun{opacity:0;transform:scale(.5)}
  html[data-theme="dark"] .theme-btn .ic-sun{opacity:1;transform:scale(1)}
  html[data-theme="dark"] .theme-btn .ic-moon{opacity:0;transform:scale(.5)}
  /* ===== 分类导航 ===== */
  .cats{
    max-width:1080px;margin:0 auto;padding:10px 18px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;
  }
  .cat{
    flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
    font-size:13px;color:var(--ink);cursor:pointer;transition:all .15s;user-select:none;white-space:nowrap;
  }
  .cat small{color:var(--muted);margin-left:4px;font-size:12px}
  .cat:hover{border-color:var(--primary);color:var(--primary)}
  .cat.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .cat.on small{color:#d6e7ff}
  /* ===== 内容 ===== */
  main{max-width:1080px;margin:0 auto;padding:8px 18px 60px}
  .sec{margin-top:30px;scroll-margin-top:118px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  .sec-head h2{font-size:20px;font-weight:700;letter-spacing:.3px}
  .sec-head h2::before{content:"";display:inline-block;width:5px;height:18px;border-radius:2px;background:var(--primary);margin-right:10px;vertical-align:-2px}
  .sec-head span{font-size:13px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;
    display:flex;align-items:center;gap:12px;transition:box-shadow .15s,transform .15s,border-color .15s;
  }
  .card:hover{border-color:var(--primary);box-shadow:var(--card-shadow)}
  .card .info{flex:1;min-width:0}
  .card .nm{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .nm b{font-weight:600;word-break:break-all}
  .tag{
    font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500;color:#fff;white-space:nowrap;
  }
  .t-lanzou{background:#e8453c}
  .t-feijipan{background:#1a7af6}
  .t-gitee{background:#c71d23}
  .t-site{background:#7950c9}
  .t-other{background:#5b6778}
  .card .time{font-size:12px;color:var(--muted);margin-top:4px}
  .go{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:9px;
    background:var(--primary);color:#fff;font-size:14px;font-weight:600;transition:background .15s;
  }
  .go:hover{background:var(--primary-strong)}
  .empty{padding:46px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
  .empty b{color:var(--ink)}
  /* ===== 页脚 ===== */
  footer{
    border-top:1px solid var(--line);background:var(--surface);text-align:center;
    padding:22px 16px;font-size:12px;color:var(--muted);
  }
  footer a{color:var(--primary)}
  @media (min-width:560px){
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  @media (min-width:900px){
    .grid{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>

<header class="top" id="top">
  <div class="top-inner">
    <div class="brand">
      <span class="mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12h14M12 5l5 5H7z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 4)"/>
        </svg>
      </span>
      <div>
        <h1>公益下载站</h1>
        <p>免登录 · 点击直达下载页</p>
      </div>
    </div>
    <div class="search">
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#66748a" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="#66748a" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="kw" type="text" placeholder="搜索资源名称，如 HE / KT / 大众…" autocomplete="off">

      <button id="themeBtn" class="theme-btn" title="切换白天/夜晚模式" aria-label="切换白天/夜晚模式">
        <svg class="ic-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" fill="currentColor"/></svg>
        <svg class="ic-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
  <nav class="cats" id="cats"></nav>
</header>

<main id="main"></main>

  function hostOf(u){
    if(/lanzou|lanz[nt]|lanzou[bsuqpt]?/.test(u)) return ["蓝奏云","t-lanzou"];
    if(/feijipan/.test(u)) return ["飞极盘","t-feijipan"];
    if(/gitee/.test(u)) return ["Gitee","t-gitee"];
    if(/wmsaves/.test(u)) return ["网页站","t-site"];
    return ["直链/其他","t-other"];
  }
  function esc(s){return (""+s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});}

  var state = {cat:"all", kw:""};

  function renderCats(){
    var el = document.getElementById("cats");
    var html = '<div class="cat'+(state.cat==="all"?" on":"")+'" data-cat="all">全部<small>'+total()+'</small></div>';
    RAW.forEach(function(sec){
      html += '<div class="cat'+(state.cat===sec.cat?" on":"")+'" data-cat="'+esc(sec.cat)+'">'+esc(sec.cat)+'<small>'+sec.items.length+'</small></div>';
    });
    el.innerHTML = html;
    el.querySelectorAll(".cat").forEach(function(c){
      c.onclick = function(){
        state.cat = c.getAttribute("data-cat");
        renderCats();
        renderMain();
        if(state.cat!=="all"){
          var t = document.getElementById("sec-"+state.cat);
          if(t) t.scrollIntoView({behavior:"smooth",block:"start"});
        }
      };
    });
  }

  function total(){var n=0;RAW.forEach(function(s){n+=s.items.length});return n;}

  function renderMain(){
    var main = document.getElementById("main");
    var html = "";
    var shown = 0;
    RAW.forEach(function(sec){
      var kw = state.kw;
      var items = sec.items.filter(function(it){ return !kw || it.n.toLowerCase().indexOf(kw)>=0; });

      if(items.length===0 && !(state.cat==="all" && !kw)) return;
      html += '<section class="sec" id="sec-'+esc(sec.cat)+'">';
      html += '<div class="sec-head"><h2>'+esc(sec.cat)+'</h2><span>'+items.length+' 个资源</span></div>';

      items.forEach(function(it){

        html += '<div class="card">';
        html +=   '<div class="info"><div class="nm"><b>'+esc(it.n)+'</b><span class="tag '+host[1]+'">'+esc(host[0])+'</span></div>';

        html +=   '<a class="go" href="'+esc(it.u)+'" target="_blank" rel="noopener">下载地址</a>';
        html += '</div>';
        shown++;
      });
      html += '</div></section>';
    });
    if(shown===0){

    }
    main.innerHTML = html;
    document.getElementById("cnt").textContent = shown;
  }

  document.getElementById("kw").addEventListener("input", function(e){
    state.kw = e.target.value.trim().toLowerCase();
    renderMain();
  });

  renderCats();
  renderMain();
</script>
